# =============================================================================
# 证书续期提醒
#
# 阿里云免费 DV 证书有效期很短（当前为 3 个月），**不会自动续期**：
#   · 到期前在控制台重新签发、重新下载、替换 /etc/nginx/ssl/ 下的两个文件，
#     然后 sudo nginx -t && sudo systemctl reload nginx
#   · 证书过期后浏览器会直接报错，站点等于不可用 —— 一定设个日历提醒
#
# 想彻底免维护可以改用 Let's Encrypt（certbot），90 天一续但是自动的：
#     sudo apt install certbot python3-certbot-nginx
#     sudo certbot --nginx -d cipherws.icu -d www.cipherws.icu
# 上面 ①a 里已经预留了 ACME 挑战目录，配合 --webroot /var/www/certbot 即可。
# =============================================================================


# =============================================================================
# 待办：www.cipherws.icu 还没有 A 记录
#
# 证书覆盖了 www.cipherws.icu，server_name 里也写了，但 DNS 里查不到这条记录
# （实测解析失败），所以 https://www.cipherws.icu 暂时打不开。
# 去域名解析处加一条即可，不用改本文件：
#     www  A  47.104.253.198
# =============================================================================


# =============================================================================
# 可选：兜底 server 块，丢弃所有未匹配域名的请求（避免别人拿 IP 直接访问扫到站点）
#
#   server {
#       listen      80 default_server;
#       listen      [::]:80 default_server;
#       server_name _;
#       return      444;
#   }
#
# 启用前先确认没有别的配置文件已经声明了 default_server，否则 nginx -t 会报冲突。
# 注意：阿里云会封「IP 直接访问 80」，所以这一块主要用于 443 的 IP 直连。
# =============================================================================
