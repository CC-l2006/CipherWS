# =============================================================================
# CipherWS 双 server 块（nginx 虚拟主机）
#
# 部署位置：/etc/nginx/conf.d/cipherws.conf
# 校验：    sudo nginx -t
# 生效：    sudo systemctl reload nginx
#
# 域名备案已通过，两个站点都走 80：
#     cipherws.icu        →  反代 http://127.0.0.1:8000（本机 node server.js --app main）
#     train.cipherws.icu  →  直接托管 /opt/cipherws/frontend/train/dist
#
# 后端接口不走浏览器直连，也由 nginx 反代：
#     /say/   → 后端网关
#     /audio/ → 后端网关（音频流，需放行 Range）
#
# 为什么后端要经 nginx 转发（而不是浏览器直接请求后端地址）：
#   1. 后端跑在本地笔记本上，靠 SakuraFrp 内网穿透暴露。樱花节点对浏览器
#      直连有安全认证限制（http 访问直接 501），由服务器侧转发可以绕开这些
#      针对浏览器的限制。
#   2. 直连是跨域，后端为此开了 allowedOriginPatterns("*") + allowCredentials(true)，
#      这是实打实的安全问题。同源反代之后这份宽松 CORS 配置可以直接删掉。
#   3. 后端真实地址不再出现在前端产物里，换隧道/换机器只改这里一处。
#
# 前置条件：
#   1. 域名备案通过（已完成），安全组放行 80
#   2. A 记录都指向 ECS 公网 IP 47.104.253.198：
#        cipherws.icu        A  47.104.253.198
#        train.cipherws.icu  A  47.104.253.198
#   3. 后端隧道（SakuraFrp）处于在线状态 —— 笔记本关机/睡眠时 /say/ 与 /audio/
#      会返回 502，这是正常的，不影响静态页面
# =============================================================================


# -----------------------------------------------------------------------------
# 主站静态服务：本机 node server.js（systemd: cipherws-web-main，监听 8000）
#
# 为什么保留 node 而不用 nginx 直接托管 dist：
#   node 那份 server.js 已实现 SPA 回退（/link 刷新不 404）与文本资源 gzip，
#   继续由它处理可以保证「本机预览」与「线上」行为完全一致，也方便随时把它
#   换成 nginx 直托做 A/B 对比。
# -----------------------------------------------------------------------------
upstream cipherws_frontend {
    server 127.0.0.1:8000;
    keepalive 16;
}


# -----------------------------------------------------------------------------
# 后端网关上游：改这一行就能切换后端来源
#
#   方案 A（当前）后端在笔记本，经 SakuraFrp 暴露：
#       server frp-hen.com:36691;        ← 保持现状，同时保留下面 https 相关指令
#
#   方案 B（将来把后端部署到这台 ECS 上）：
#       server 127.0.0.1:8080;
#       然后把 /say/ 与 /audio/ 里的 proxy_pass https:// 改成 http://，
#       并删掉 proxy_ssl_server_name / proxy_ssl_name 两行。
# -----------------------------------------------------------------------------
upstream cipherws_backend {
    server frp-hen.com:36691;
    keepalive 16;
}


# =============================================================================
# server 块 ①：主站  cipherws.icu
# =============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name cipherws.icu www.cipherws.icu;

    access_log /var/log/nginx/cipherws-main.access.log;
    error_log  /var/log/nginx/cipherws-main.error.log;

    # ---- 安全响应头 ----
    # 注意：子 location 里如果再出现 add_header，nginx 会整段丢掉这里继承的头。
    # 所以下面所有缓存控制都用 expires（它不算 add_header），不要改成 add_header。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 同源反代后端：名言接口 ----
    location /say/ {
        proxy_pass         https://cipherws_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              frp-hen.com:36691;
        proxy_ssl_server_name on;
        proxy_ssl_name     frp-hen.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 若樱花隧道启用了「访问认证」，在这里补上凭据
        # （用户名:密码 的 base64，例如 echo -n 'user:pass' | base64）：
        # proxy_set_header Authorization "Basic dXNlcjpwYXNz";
    }

    # ---- 同源反代后端：音频流 ----
    # Range 必须原样透传，否则播放器拖不动进度条（后端已支持 Accept-Ranges）。
    # 默认情况下 nginx 会把除 Host/Connection 之外的请求头原样转发，
    # 所以客户端的 Range / If-Range 会自动带过去，不需要额外 proxy_set_header。
    location /audio/ {
        proxy_pass         https://cipherws_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              frp-hen.com:36691;
        proxy_ssl_server_name on;
        proxy_ssl_name     frp-hen.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 音频是长连接流式响应，绝不能先缓冲到磁盘再回给客户端
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_read_timeout       300s;

        # proxy_set_header Authorization "Basic dXNlcjpwYXNz";
    }

    # ---- 其余全部交给本机 node：静态资源 + SPA 回退 ----
    # 注意：nginx 前缀匹配取「最长命中」，所以 /say/ 与 /audio/ 会先于 / 被匹配。
    location / {
        proxy_pass         http://cipherws_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 静态资源保持 nginx 默认缓冲策略：node 对大文件只设 Content-Length、
        # 对 gzip 文本走 chunked，两种情况默认缓冲都能正确处理，
        # 关掉反而会让慢速客户端拖长占用上游连接。
    }

    # 后端隧道掉线时，API 会返回 502。这是预期行为：静态页面照常打开，
    # 只是「每日一句」和音乐播放器取不到数据。
}


# =============================================================================
# server 块 ②：云间列车  train.cipherws.icu
#
# 纯 WebGL2 静态页，没有路由、没有后端调用，直接由 nginx 托管 dist，
# 不需要再常驻一个 node 进程（零额外部署步骤）。
#
# 若想让列车站也走 node（npm run serve:train，监听 8001），
# 把下面的 location / 换成：
#     location / {
#         proxy_pass         http://127.0.0.1:8001;
#         proxy_http_version 1.1;
#         proxy_set_header   Connection "";
#         proxy_set_header   Host $host;
#     }
# 并在 frontend/ 下另起一个 systemd 实例（见文档第六节）。
# =============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name train.cipherws.icu;

    root  /opt/cipherws/frontend/train/dist;
    index index.html;

    charset    utf-8;
    access_log /var/log/nginx/cipherws-train.access.log;
    error_log  /var/log/nginx/cipherws-train.error.log;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带内容 hash 的构建产物：一年强缓存
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # 文件名不含 hash 的静态资源：缓存必须短，否则换图后用户长期看不到更新
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }

    # 现在没有路由，但先留着回退，以后加路由不用改 nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不缓存：否则用户会一直拿到旧版本，
    # 而它引用的 hash 资源早被新构建删掉了，页面直接白屏
    location = /index.html {
        expires -1;
    }
}


# =============================================================================
# HTTPS（本次不做，留作下一步）
#
# 域名备案已通过，随时可以签发证书。步骤：
#     sudo apt install certbot python3-certbot-nginx
#     sudo certbot --nginx -d cipherws.icu -d www.cipherws.icu -d train.cipherws.icu
# certbot 会自动补出 443 的 server 块，并把 80 改成跳转。
#
# 手工版（两个站点各一份）：
#   server {
#       listen      443 ssl;
#       listen      [::]:443 ssl;
#       server_name cipherws.icu www.cipherws.icu;
#       ssl_certificate     /etc/letsencrypt/live/cipherws.icu/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/cipherws.icu/privkey.pem;
#       ssl_protocols       TLSv1.2 TLSv1.3;
#       # 其余 location 与上面的 80 块完全一致，直接复制
#   }
#
# 开启 HTTP/2 的写法随 nginx 版本而变，写错会让 nginx -t 直接失败：
#   nginx ≥ 1.25.1（Ubuntu 24.04+）  →  listen 443 ssl;  另起一行 http2 on;
#   nginx <  1.25.1（Ubuntu 22.04）  →  listen 443 ssl http2;  不要写 http2 on;
# 用 nginx -v 先确认版本。
#
# 注意：反向代理到 SakuraFrp 时，如果隧道侧证书链有自签成分，
# nginx 会报 upstream SSL 校验失败。届时可先加 proxy_ssl_verify off; 确认链路，
# 再决定是否用 proxy_ssl_trusted_certificate 指定 CA。
# =============================================================================


# =============================================================================
# 可选：兜底 server 块，丢弃所有未匹配域名的请求（避免别人拿 IP 直接访问扫到站点）
#
#   server {
#       listen      80 default_server;
#       listen      [::]:80 default_server;
#       server_name _;
#       return      444;
#   }
#
# 启用前先确认没有别的配置文件已经声明了 default_server，否则 nginx -t 会报冲突。
# =============================================================================
