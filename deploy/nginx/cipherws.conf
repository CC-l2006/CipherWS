# =============================================================================
# CipherWS 双站点 nginx 配置
#
# 部署位置：/etc/nginx/conf.d/cipherws.conf
# 校验：    sudo nginx -t
# 生效：    sudo systemctl reload nginx
#
# 当前状态（2026-10-12）：
#     cipherws.icu / www.cipherws.icu   :80 跳转 → :443 HTTPS ✅ 已配置
#     train.cipherws.icu                :80 HTTP（HTTPS 待它自己的证书）
#
# 为什么列车站还是 HTTP：SSL 证书按域名签发，主站那张证书只覆盖
# cipherws.icu 与 www.cipherws.icu，**不含子域名 train.cipherws.icu**。
# 子域名不会被主域名证书覆盖，这是证书机制决定的。等给列车站单独签一张
# （阿里云每账号每年 20 张免费 DV 额度）后，把下面「列车站 HTTPS」那段
# 注释打开即可。详见 docs/2026-10-12/HTTPS证书配置.md。
#
# 证书文件约定（下面 ssl_certificate 用的就是这两个路径）：
#     /etc/nginx/ssl/cipherws.icu.pem        证书 + 中间链
#     /etc/nginx/ssl/cipherws.icu.key        私钥（必须 chmod 600、属主 root）
#
# 后端接口不走浏览器直连，由 nginx 同源反代：
#     /say/   → 后端网关
#     /audio/ → 后端网关（音频流，需放行 Range）
#
# 为什么后端要经 nginx 转发（而不是浏览器直接请求后端地址）：
#   1. 后端跑在本地笔记本上，靠 SakuraFrp 内网穿透暴露。樱花节点对浏览器
#      直连有安全认证限制（http 访问直接 501），由服务器侧转发可以绕开这些
#      针对浏览器的限制。
#   2. 直连是跨域，后端为此开了 allowedOriginPatterns("*") + allowCredentials(true)，
#      这是实打实的安全问题。同源反代之后这份宽松 CORS 配置可以直接删掉。
#   3. 后端真实地址不再出现在前端产物里，换隧道/换机器只改这里一处。
#
# 前置条件：
#   1. 域名备案通过（已完成），安全组放行 80 与 443
#   2. A 记录都指向 ECS 公网 IP 47.104.253.198：
#        cipherws.icu        A  47.104.253.198   （已有）
#        train.cipherws.icu  A  47.104.253.198   （已有）
#        www.cipherws.icu    A  47.104.253.198   （**还没有，见文末说明**）
#   3. 后端隧道（SakuraFrp）在线 —— 笔记本关机/睡眠时 /say/ 与 /audio/
#      会返回 502，这是正常的，不影响静态页面
# =============================================================================


# -----------------------------------------------------------------------------
# 主站静态服务：本机 node server.js（systemd: cipherws-web 或 cipherws-web-main，
# 监听 8000；脚本会自动探测实际服务名）
#
# 为什么保留 node 而不用 nginx 直接托管 dist：
#   node 那份 server.js 已实现 SPA 回退（/link 刷新不 404）与文本资源 gzip，
#   继续由它处理可以保证「本机预览」与「线上」行为完全一致，也方便随时把它
#   换成 nginx 直托做 A/B 对比。
# -----------------------------------------------------------------------------
upstream cipherws_frontend {
    server 127.0.0.1:8000;
    keepalive 16;
}


# -----------------------------------------------------------------------------
# 后端网关上游：改这一行就能切换后端来源
#
#   方案 A（当前）后端在笔记本，经 SakuraFrp 暴露：
#       server frp-hen.com:36691;        ← 保持现状，同时保留下面 https 相关指令
#
#   方案 B（将来把后端部署到这台 ECS 上）：
#       server 127.0.0.1:8080;
#       然后把 /say/ 与 /audio/ 里的 proxy_pass https:// 改成 http://，
#       并删掉 proxy_ssl_server_name / proxy_ssl_name 两行。
# -----------------------------------------------------------------------------
upstream cipherws_backend {
    server frp-hen.com:36691;
    keepalive 16;
}


# =============================================================================
# server 块 ①a：主站 HTTP —— 只做跳转，不再提供内容
#
# 顺序很重要：先确认 HTTPS 能用，再把 80 改成跳转。
# 本文件已经是「跳转」形态，如果你是在已有站点上首次启用 HTTPS，
# 建议先只加下面那个 443 块、保留原 80 块供内容，验证 https 通之后再回来
# 把这里的 location / 改成 return 301。
# =============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name cipherws.icu www.cipherws.icu;

    access_log /var/log/nginx/cipherws-main.access.log;
    error_log  /var/log/nginx/cipherws-main.error.log;

    # 证书续期用的 ACME 挑战目录：certbot --webroot 会往这里写文件，
    # 必须放在跳转之前，否则续期时会被 301 掉导致验证失败。
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }

    # 其余一律跳 HTTPS。301 会被浏览器长期缓存，若担心配置有误想先试水，
    # 可临时用 302。
    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
# server 块 ①b：主站 HTTPS —— 真正提供内容的地方
# =============================================================================
server {
    # HTTP/2 的写法随版本而变，写错会让 nginx -t 直接失败：
    #   nginx <  1.25.1（Ubuntu 22.04 的 1.18、24.04 的 1.24）→ 只能写成
    #              listen 443 ssl http2;   ← 本文件用的就是这个
    #   nginx >= 1.25.1                                       → 推荐写成
    #              listen 443 ssl;  另起一行 http2 on;
    # 注意 `http2 on;` 这条独立指令在 1.25.1 之前**不存在**，写了会直接报错，
    # 所以下面用兼容所有版本的写法。新版本加载时会打印一条 deprecated 警告，
    # 那只是提示，不影响运行。用 nginx -v 确认自己的版本。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name cipherws.icu www.cipherws.icu;

    access_log /var/log/nginx/cipherws-main.access.log;
    error_log  /var/log/nginx/cipherws-main.error.log;

    # ---- 证书 ----
    ssl_certificate     /etc/nginx/ssl/cipherws.icu.pem;
    ssl_certificate_key /etc/nginx/ssl/cipherws.icu.key;

    # ---- TLS 参数 ----
    # 只留 TLSv1.2 / 1.3：1.0 与 1.1 已被主流浏览器弃用，且不安全。
    ssl_protocols             TLSv1.2 TLSv1.3;
    # TLS 1.3 的套件不可配置，这里配的是 1.2 用的（Mozilla intermediate 列表）
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ---- OCSP stapling（可选，能加快握手）----
    # 开启后 nginx 需要自己解析 OCSP 地址，所以必须先配 resolver，
    # 否则日志里会出现 "no resolver defined"。要开就把下面三行一起打开：
    # resolver            223.5.5.5 119.29.29.29 valid=300s;   # 阿里云 / DNSPod
    # resolver_timeout    5s;
    # ssl_stapling        on;
    # ssl_stapling_verify on;

    # ---- 安全响应头 ----
    # 注意：子 location 里如果再出现 add_header，nginx 会整段丢掉这里继承的头。
    # 所以下面所有缓存控制都用 expires（它不算 add_header），不要改成 add_header。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- HSTS：先别急着开 ----
    # 打开后浏览器会记住「这个域名只能用 HTTPS」，在 max-age 到期前**无法回退到
    # HTTP**。而阿里云免费证书有效期很短、且要手工续期，一旦忘记续期、证书过期，
    # 老访客会被浏览器直接挡在门外，连 HTTP 兜底都没有。
    # 建议：确认 HTTPS 稳定运行一段时间、并且设好了续期提醒之后再打开。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 同源反代后端：名言接口 ----
    location /say/ {
        proxy_pass         https://cipherws_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              frp-hen.com:36691;
        proxy_ssl_server_name on;
        proxy_ssl_name     frp-hen.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 若樱花隧道启用了「访问认证」，在这里补上凭据
        # （用户名:密码 的 base64，例如 echo -n 'user:pass' | base64）：
        # proxy_set_header Authorization "Basic dXNlcjpwYXNz";
    }

    # ---- 同源反代后端：音频流 ----
    # Range 必须原样透传，否则播放器拖不动进度条（后端已支持 Accept-Ranges）。
    # 默认情况下 nginx 会把除 Host/Connection 之外的请求头原样转发，
    # 所以客户端的 Range / If-Range 会自动带过去，不需要额外 proxy_set_header。
    location /audio/ {
        proxy_pass         https://cipherws_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              frp-hen.com:36691;
        proxy_ssl_server_name on;
        proxy_ssl_name     frp-hen.com;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 音频是长连接流式响应，绝不能先缓冲到磁盘再回给客户端
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_read_timeout       300s;

        # proxy_set_header Authorization "Basic dXNlcjpwYXNz";
    }

    # ---- 其余全部交给本机 node：静态资源 + SPA 回退 ----
    # 注意：nginx 前缀匹配取「最长命中」，所以 /say/ 与 /audio/ 会先于 / 被匹配。
    location / {
        proxy_pass         http://cipherws_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 静态资源保持 nginx 默认缓冲策略：node 对大文件只设 Content-Length、
        # 对 gzip 文本走 chunked，两种情况默认缓冲都能正确处理，
        # 关掉反而会让慢速客户端拖长占用上游连接。
    }

    # 后端隧道掉线时，API 会返回 502。这是预期行为：静态页面照常打开，
    # 只是「每日一句」和音乐播放器取不到数据。
}


# =============================================================================
# server 块 ②：云间列车  train.cipherws.icu（HTTP）
#
# 纯 WebGL2 静态页，没有路由、没有后端调用，直接由 nginx 托管 dist，
# 不需要再常驻一个 node 进程（零额外部署步骤）。
#
# 若想让列车站也走 node（npm run serve:train，监听 8001），
# 把下面的 location / 换成：
#     location / {
#         proxy_pass         http://127.0.0.1:8001;
#         proxy_http_version 1.1;
#         proxy_set_header   Connection "";
#         proxy_set_header   Host $host;
#     }
# 并在 frontend/ 下另起一个 systemd 实例（见文档第六节）。
# =============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name train.cipherws.icu;

    root  /opt/cipherws/frontend/train/dist;
    index index.html;

    charset    utf-8;
    access_log /var/log/nginx/cipherws-train.access.log;
    error_log  /var/log/nginx/cipherws-train.error.log;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带内容 hash 的构建产物：一年强缓存
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # 文件名不含 hash 的静态资源：缓存必须短，否则换图后用户长期看不到更新
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
    }

    # 现在没有路由，但先留着回退，以后加路由不用改 nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 绝不缓存：否则用户会一直拿到旧版本，
    # 而它引用的 hash 资源早被新构建删掉了，页面直接白屏
    location = /index.html {
        expires -1;
    }
}


