server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cipherws-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: nacos
      password: 1357924680bb
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
    gateway:
      # Spring Cloud Gateway 4.3 起使用 server.webflux.* 命名空间
      server:
        webflux:
          # 使用显式路由（如需按服务名自动映射，可开启 discovery.locator）
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: cipherws-say-service
              uri: lb://cipherws-say-service
              predicates:
                - Path=/say/**
            - id: cipherws-audio-service
              uri: lb://cipherws-say-service
              predicates:
                - Path=/audio/**
            - id: cipherws-portal-service
              uri: lb://cipherws-portal-service
              predicates:
                - Path=/portal/**
            # 笔记站：/api/** 与 /uploads/** 原样转给 note-gateway。
            # 不加 StripPrefix —— note-gateway 自己就是按 /api/** 分流的，
            # 它会剥掉 /api 再转发给 note-* 服务。
            # 这样笔记本只需要穿透一个 8080 端口，笔记站也能走通，
            # nginx 那边 /api/ 直接反代隧道即可（见 deploy/nginx/cipherws.conf）。
            - id: note-gateway-api
              uri: lb://note-gateway
              predicates:
                - Path=/api/**
            - id: note-gateway-uploads
              uri: lb://note-gateway
              predicates:
                - Path=/uploads/**
  config:
    import:
      - optional:nacos:cipherws-gateway.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
