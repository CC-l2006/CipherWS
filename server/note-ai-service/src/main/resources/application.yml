server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: note-ai-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cipherws_note?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1357924680bb}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1357924680bb}
        import-check:
          enabled: false

note:
  ai:
    # 第三方模型的响应可能较慢，读超时给足；具体模型名与地址在 ai_config 表里配置
    timeout-seconds: ${NOTE_AI_TIMEOUT:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.example.cipherws.note: INFO
