server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: note-ai-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/CipherWS?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1357924680bb}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1357924680bb}
        import-check:
          enabled: false

# MyBatis 配置
mybatis:
  # XML 映射文件的位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类所在包，XML 里就不用写全限定名
  type-aliases-package: org.example.cipherws.note.common.entity
  configuration:
    # ai_quota -> aiQuota 的自动映射，省掉一堆 resultMap
    map-underscore-to-camel-case: true

note:
  ai:
    # 第三方模型的响应可能较慢，读超时给足；具体模型名与地址在 ai_config 表里配置
    timeout-seconds: ${NOTE_AI_TIMEOUT:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.example.cipherws.note: INFO
    # DEBUG 才能看到 MyBatis 实际执行的 SQL 与参数，映射出问题时先看这里
    org.example.cipherws.note.ai.mapper: DEBUG
