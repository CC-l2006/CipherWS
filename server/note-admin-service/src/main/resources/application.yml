server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: note-admin-service
  # 与 note-schema.sql 同一个库：CipherWS（与 note-user / note-core 保持一致）
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/CipherWS?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      # 服务发现：注册后由 note-gateway 按服务名路由到本服务
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1357924680bb}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1357924680bb}
        # 本服务的配置就写在这个文件里，不从 Nacos 配置中心拉。
        # nacos-config 在 classpath 上时 Spring Cloud 默认要求必须写 spring.config.import，
        # 关掉这项检查，本地没起配置中心也能把服务拉起来。
        import-check:
          enabled: false

# MyBatis 配置
mybatis:
  # XML 映射文件的位置：AdminMapper.xml / AdminLogMapper.xml 都放在这里
  mapper-locations: classpath:mapper/*.xml
  # 实体类所在包（note-common），XML 里就可以写 resultType="NoteUser" 而不是全限定名
  type-aliases-package: org.example.cipherws.note.common.entity
  configuration:
    # ai_quota -> aiQuota 的自动映射。⚠️ 只对实体生效，resultType="map" 的 key 还是下划线原样
    map-underscore-to-camel-case: true

# 业务包打 INFO 就够：MyBatis 的 SQL 明细要 DEBUG，需要时再单独放开 mapper 包
logging:
  level:
    org.example.cipherws.note: INFO
    # DEBUG 才能看到 MyBatis 实际执行的 SQL 与参数，映射出问题时先看这里
    org.example.cipherws.note.admin.mapper: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
