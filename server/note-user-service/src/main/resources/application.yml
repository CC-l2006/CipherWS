server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: note-user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/CipherWS?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      # 头像上限 2MB，request 给 3MB 留出表单开销
      max-file-size: 2MB
      max-request-size: 3MB
  # 邮件：这里**故意不写 host/port/username/password**。
  # 原因：只要 spring.mail.host 出现（哪怕是空串），Spring Boot 就会创建
  # JavaMailSender 和 mail 健康检查，没配密码时整体 /actuator/health 直接变 DOWN。
  # 不写它 → 没有这个 bean → MailService 自动退化成「把验证码写日志」，
  # 本地开发不配邮箱也能跑通找回密码/绑定邮箱。
  #
  # 真要发信时用环境变量（Spring 会自动映射成 spring.mail.*，无需改本文件）：
  #   SPRING_MAIL_HOST=smtp.qq.com   SPRING_MAIL_PORT=465
  #   SPRING_MAIL_USERNAME=you@qq.com  SPRING_MAIL_PASSWORD=邮箱授权码
  #   NOTE_MAIL_ENABLED=true          MAIL_FROM=you@qq.com
  mail:
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          # 465 端口走隐式 SSL；若用 587 则把 ssl 换成 starttls
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1357924680bb}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:1357924680bb}
        import-check:
          enabled: false

# MyBatis 配置
mybatis:
  # XML 映射文件的位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类所在包，XML 里就不用写全限定名
  type-aliases-package: org.example.cipherws.note.common.entity
  configuration:
    # ai_quota -> aiQuota 的自动映射，省掉一堆 resultMap
    map-underscore-to-camel-case: true

note:
  mail:
    # 只有这个开关打开、且 spring.mail.host 与 MAIL_USERNAME 都非空时才真发信
    enabled: ${NOTE_MAIL_ENABLED:false}
    # 发件人；留空则用 MAIL_USERNAME（大多数邮箱要求两者一致）
    from: ${MAIL_FROM:}
  upload:
    # 头像落盘目录。相对路径是相对**进程工作目录**，生产建议给绝对路径
    dir: ${NOTE_UPLOAD_DIR:./uploads}
    max-bytes: 2097152
  jwt:
    # 必须与 note-gateway 的配置一致，否则网关验不过这里签发的 token
    secret: ${NOTE_JWT_SECRET:cipherws-note-dev-secret-change-me-in-production-32bytes}
    ttl-seconds: ${NOTE_JWT_TTL:7200}
  auth:
    # 演示开关：把验证码回传给前端，便于没有邮件服务时跑通找回密码。
    # ⚠️ 生产环境务必设为 false，否则任何知道邮箱的人都能重置别人的密码。
    expose-code: ${NOTE_EXPOSE_CODE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      # 关掉邮件健康检查。
      # 配了 SPRING_MAIL_HOST 之后 Spring 会自动注册 MailHealthIndicator，
      # 它每次心跳都**新建一条 SMTP 连接**去测活 —— 实测单次耗时 11.9 秒。
      # 后果：/actuator/health 被拖到十几秒，nginx / k8s 的探活直接超时，
      # 服务明明正常却显示不健康。
      # 而且「邮件暂时发不出去」不该把整个服务判成 DOWN：用户照样能读写笔记。
      enabled: false

logging:
  level:
    org.example.cipherws.note: INFO
    # DEBUG 才能看到 MyBatis 实际执行的 SQL 与参数，映射出问题时先看这里
    org.example.cipherws.note.user.mapper: DEBUG
